---
# Modules sequence to execute automatically
sequence:
  - prepare:
      - welcome
      - locale
      - keyboard
  - oem:
      - partition
  - install:
      - users
      - packages
      - tracking
      - finished

# Pre-filled configuration responses
autoInstall:
  enabled: true
  prompt: false # Set to true if you want a confirmation screen before it wipes the drive

# Automated Partitioning Layout
partition:
  device: "/dev/nvme0n1" # Target drive
  method: erase
  filesystem: "btrfs" # Automatically formats to Btrfs

# Pre-defined User Setup
users:
  username: "castle"
  oemUser: false
  password: "wearedogs"
  autologin: false

# Automated Package Selection (Where you force Niri)
packages:
  operations:
    - install:
        - cachyos-niri-settings
        - niri
        - fuzzel
        - alacritty
