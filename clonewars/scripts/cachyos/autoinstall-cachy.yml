---
# Modules sequence to execute automatically
sequence:
  - prepare:
      - welcome
      - locale
      - keyboard
  - oem:
      - partition
  - install:
      - users
      - packages
      - tracking
      - finished

# Pre-filled configuration responses
autoInstall:
  enabled: true
  prompt: false # Set to true if you want a confirmation screen before it wipes the drive

# Automated Partitioning Layout
partition:
  device: "/dev/vda" # Target virtio drive
  method: erase
  partitionTable: "mbr"
  filesystem: "btrfs"

bootloader:
  name: "limine"

# Pre-defined User Setup
users:
  username: "castle"
  oemUser: false
# SECURITY: Castle ships NO default install password. Set a strong, unique
# password here before running autoinstall-cachy.sh -- the installer bakes
# this value into the new system, and any shared default committed to the
# repo is known to everyone with read access. The regression test
# clonewars/scripts/cachyos/test-config.sh rejects known weak defaults
# (wearedogs, password, 123456, ...) so a lazy value cannot slip back in.
  password: "CHANGE-ME-before-first-boot"
  autologin: false

# Automated Package Selection (Minimal KDE + UFW)
packages:
  operations:
    - install:
        - cachyos-kde-settings
        - plasma-desktop
        - sddm
        - ufw
        - ufw-extras
