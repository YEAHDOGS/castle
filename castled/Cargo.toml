[package]
name = "castled"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
fs4 = "1.1.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
mail-parser = "1.0.1"
mime_guess = "2.0.5"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
sysinfo = "0.40.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "signal"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
trash = "5"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
