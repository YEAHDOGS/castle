; Castle Gatehouse presence node: ESP32 + Hi-Link LD2450 mmWave radar.
; Build and flash with PlatformIO:  pio run -t upload   then   pio device monitor
; Copy include/config.example.h to include/config.h and fill it in first.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0
